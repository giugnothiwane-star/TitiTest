name: Ultimate Auto Builder

on:
  push:
    paths:
      - 'ultimate-auto-builder/**'
      - '.github/workflows/ultimate-auto-builder.yml'
  pull_request:
    paths:
      - 'ultimate-auto-builder/**'
      - '.github/workflows/ultimate-auto-builder.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Publication des captures d'écran dans une vérification « Captures en jeu » (annotations).
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ultimate-auto-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version NeoForge 21.1 la plus récente
        id: neo
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's#</?version>##g' | sort -t. -k3 -n | tail -1)
          echo "Version NeoForge utilisée : ${latest}"
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      - name: Validation GLSL des shaders du studio (glslang)
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/glsl" glslang-validator-prebuilt-predownloaded
          V="$RUNNER_TEMP/glsl/node_modules/glslang-validator-prebuilt-predownloaded/bin/glslangValidator.linux"
          chmod +x "$V"
          for f in src/main/resources/assets/ultimateautobuilder/shaders/program/*.fsh; do
            cp "$f" "$RUNNER_TEMP/shader.frag"
            "$V" "$RUNNER_TEMP/shader.frag" || { echo "Shader invalide : $f"; exit 1; }
            echo "OK : $f"
          done

      - name: Compilation, tests unitaires et JAR
        run: ./gradlew build -Pneo_version=${{ steps.neo.outputs.version }} --stacktrace

      - name: JAR du mod
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-auto-builder-jar
          path: ultimate-auto-builder/build/libs/*.jar

      - name: Sonde d'API (signatures Minecraft/NeoForge)
        continue-on-error: true
        run: python3 tools/api_probe.py

      - name: GameTests (serveur Minecraft réel)
        run: ./gradlew runGameTestServer -Pneo_version=${{ steps.neo.outputs.version }} --stacktrace

      - name: Journaux des GameTests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            ultimate-auto-builder/run/logs/
            ultimate-auto-builder/run/gametestserver/logs/
          if-no-files-found: ignore

      # Vérification visuelle : vrai client Minecraft sous affichage virtuel (rendu logiciel Mesa).
      # Le mod parcourt ses écrans et enregistre des captures, imprimées ensuite dans le journal.
      - name: Captures d'écran en jeu (client réel, affichage virtuel)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          LEVEL=$(find run -name level.dat -not -path '*/saves/*' | head -n 1)
          echo "Monde de test : $LEVEL"
          mkdir -p run/saves && rm -rf run/saves/uab_capture run/screenshots
          # Premier lancement sans écran d'accessibilité ni didacticiel (sinon l'accès rapide au monde est bloqué).
          printf 'onboardAccessibility:false\nnarrator:0\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\n' > run/options.txt
          if [ -n "$LEVEL" ]; then cp -r "$(dirname "$LEVEL")" run/saves/uab_capture; rm -f run/saves/uab_capture/session.lock; fi
          timeout 1080 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runCaptureClient -Pneo_version=${{ steps.neo.outputs.version }} --console=plain || echo "Client terminé avec le code $?"
          ls -la run/screenshots || true
          grep -E "Capture|Exception|ERROR|GL info|Backend" run/logs/latest.log | grep -viE "flite|narrator|OpenAL|SoundSystem" | cut -c1-300 | tail -n 80 || true
          java tools/CaptureB64.java run/screenshots 960 "$RUNNER_TEMP/captures.json" "${{ github.sha }}"
          if [ -f "$RUNNER_TEMP/captures.json" ]; then
            curl -sS -o /dev/null -w "Vérification « Captures en jeu » : HTTP %{http_code}\n" -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/check-runs" --data-binary "@$RUNNER_TEMP/captures.json"
          fi
