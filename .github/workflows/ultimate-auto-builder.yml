name: Ultimate Auto Builder

on:
  push:
    paths:
      - 'ultimate-auto-builder/**'
      - '.github/workflows/ultimate-auto-builder.yml'
  pull_request:
    paths:
      - 'ultimate-auto-builder/**'
      - '.github/workflows/ultimate-auto-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ultimate-auto-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version NeoForge 21.1 la plus récente
        id: neo
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's#</?version>##g' | sort -t. -k3 -n | tail -1)
          echo "Version NeoForge utilisée : ${latest}"
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      - name: Compilation, tests unitaires et JAR
        run: ./gradlew build -Pneo_version=${{ steps.neo.outputs.version }} --stacktrace

      - name: GameTests (serveur Minecraft réel)
        run: ./gradlew runGameTestServer -Pneo_version=${{ steps.neo.outputs.version }} --stacktrace

      - name: Journaux des GameTests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: |
            ultimate-auto-builder/run/logs/
            ultimate-auto-builder/run/gametestserver/logs/
          if-no-files-found: ignore

      - name: JAR du mod
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-auto-builder-jar
          path: ultimate-auto-builder/build/libs/*.jar
